[package]
name = "p2pjack"
version = "0.1.0"
description = "P2P virtual LAN for games (Hamachi / Radmin VPN alternative) without servers"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
bincode = "1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard"] }
hex = "0.4.3"
igd-next = { version = "0.18.0", features = ["aio_tokio"] }
mainline = "8.0.1"
png = "0.18.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
tun-rs = { version = "2.8.16", features = ["async"] }
ureq = "3.5.0"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

# Argon2 is painfully slow without optimizations; keep debug builds and tests snappy.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"

[workspace]
members = [".", "installer"]
# Установщик вкладывает в себя собранный p2pjack.exe, поэтому собирается отдельно: scripts/build-installer.ps1
default-members = ["."]
